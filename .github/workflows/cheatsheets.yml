name: Build cheatsheets

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: typst-community/setup-typst@00ad6338f0b34724ea002136bfb701a6c18585b0 # v5.3.2
        with:
          typst-version: '0.15.1'
      - name: Build and check each PDF
        run: |
          if ! command -v pdfinfo >/dev/null || ! command -v pdftoppm >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends poppler-utils
          fi
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          make -C cheatsheets -j2 check-pdfs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cheatsheets
          path: build/cheatsheets/*.pdf
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - name: Build the gallery with the shared FlatPPL theme
        env:
          FLATPPL_THEME_DIR: ${{ runner.temp }}/flatppl-theme
        run: |
          archive="$RUNNER_TEMP/flatppl-theme-v0.1.11.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            'https://github.com/flatppl/flatppl-theme/releases/download/v0.1.11/flatppl-theme-v0.1.11.tar.gz' \
            --output "$archive"
          echo "e4fb8c97bd9fd5b472e205e01c083f05b9821233048ee8d3bc2de3d47e7a46b5  $archive" | sha256sum --check
          mkdir -p "$FLATPPL_THEME_DIR"
          tar -xzf "$archive" -C "$FLATPPL_THEME_DIR"
          bun gallery/build.mjs
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: build/gallery

  deploy-gallery:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: deploy-cheatsheet-gallery
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check the current main revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$main_sha" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        if: steps.revision.outputs.current == 'true'
        id: deployment

  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish-cheatsheets
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cheatsheets
          path: pdfs
      - name: Publish individual PDFs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          main_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo 'A newer revision of main will publish its sheets.'
            exit 0
          fi
          tag="cheatsheets-$GITHUB_SHA"
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" == false ]]; then
              echo 'This revision already has a release.'
              exit 0
            fi
          else
            gh release create "$tag" --target "$GITHUB_SHA" --draft \
              --title "FlatPPL cheatsheets (${GITHUB_SHA:0:7})" \
              --notes 'Each PDF contains one A4 landscape sheet with its example files attached.'
          fi
          gh release upload "$tag" pdfs/*.pdf --clobber
          gh release edit "$tag" --draft=false --latest
